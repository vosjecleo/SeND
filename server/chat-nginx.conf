# Included ONLY in chat.deltie.net's existing TLS server block. Preserve its
# listen directives and certificate paths and all Matrix/RTC server blocks.
root /srv/storage/www/deltiecord-web/current;
index index.html;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Embedder-Policy require-corp always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Cache-Control "no-cache" always;
# flutter_rust_bridge 2.12 initializes wasm-bindgen with new Function. Until
# upstream removes it, unsafe-eval is required ONLY on this isolated app host.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' https: blob: data:; media-src 'self' https: blob:; connect-src 'self' https: wss:; worker-src 'self' blob:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
client_max_body_size 1m;

# Callback query strings may contain one-use Matrix login tokens / OIDC codes.
# Do not log/cache them or fall back to the Flutter bootstrap on a missing file.
location = /auth.html {
    access_log off;
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
}

location = /_matrix/push/v1/notify {
    proxy_pass http://127.0.0.1:8141;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 45s;
    client_max_body_size 64k;
}
location ^~ /api/push/ {
    proxy_pass http://127.0.0.1:8141;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 45s;
    client_max_body_size 64k;
}
location = /api/servers/klipy/search {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header X-Real-IP $remote_addr;
}
location = /api/servers/telegram/stickers {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header X-Real-IP $remote_addr;
}
location = /api/servers/telegram/stickers/file {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 45s;
}
location /api/ { return 404; }
location ~ /\. { deny all; }
location ~* \.wasm$ { default_type application/wasm; try_files $uri =404; }
location ~* \.(js|wasm|json|png|ico|woff2?)$ { try_files $uri =404; }
location / { try_files $uri $uri/ /index.html; }
