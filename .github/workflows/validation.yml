name: Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_ARCHIVE: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.0-stable.tar.xz
  FLUTTER_SHA256: 26cd99d3d94b1367e6b50535a18aeef0282c10a535bbe3ec493534dcdab75296

jobs:
  common:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/flutter-linux.tar.xz
          key: flutter-archive-linux-${{ runner.arch }}-${{ env.FLUTTER_SHA256 }}
      - name: Install verified Flutter
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/flutter-linux.tar.xz"
          if [[ ! -f "$archive" ]]; then
            curl --fail --location --retry 3 --proto '=https' --tlsv1.2 "$FLUTTER_ARCHIVE" -o "$archive"
          fi
          echo "$FLUTTER_SHA256  $archive" | sha256sum --check --strict
          tar -C "$RUNNER_TEMP" -xf "$archive"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.pub-cache
          key: validation-pub-${{ runner.arch }}-${{ env.FLUTTER_SHA256 }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: validation-pub-${{ runner.arch }}-${{ env.FLUTTER_SHA256 }}-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg desktop-file-utils zsync jq
          python3 -m venv "$RUNNER_TEMP/test-python"
          "$RUNNER_TEMP/test-python/bin/pip" install -r server/requirements-web-push.txt
          flutter pub get --enforce-lockfile
      - name: Format and analysis
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-pub
      - name: Native unit and widget tests
        run: flutter test --no-pub --concurrency=2
      - name: Server, configuration and packaging tests
        run: |
          "$RUNNER_TEMP/test-python/bin/python" -m unittest discover -s server -p 'test_*.py'
          python3 -m unittest discover -s packaging -p 'test_*.py'
          python3 -m unittest discover -s packaging/linux -p 'test_*.py'
          find packaging -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Browser bridge and worker unit tests
        run: |
          for script in web/sw.js web/browser_bridge.js web/local_vault.js web/push_preview_store.js web/push_preview.js; do
            node --check "$script"
          done
          node --test tool/web_push_test.cjs tool/web_push_preview_test.cjs tool/web_runtime_probe_test.mjs tool/viewport_recovery_test.mjs
