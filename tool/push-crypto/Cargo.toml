[package]
name = "send-push-crypto"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vodozemac = { version = "=0.10.0", default-features = false, features = ["js"] }
wasm-bindgen = "=0.2.100"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

